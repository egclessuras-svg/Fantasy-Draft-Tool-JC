<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Draft Assistant - Pre Draft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="/static/css/hal-theme.css" rel="stylesheet">
    <style>
        .draft-status {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .nav-tabs .nav-link {
            border: none;
            border-radius: 10px 10px 0 0;
            margin-right: 5px;
            color: #6c757d;
            font-weight: 500;
        }
        .nav-tabs .nav-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }
        .nav-tabs .nav-link:hover {
            background: #f8f9fa;
            color: #495057;
        }
        .filter-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .players-horizontal-list {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
            padding: 0;
        }
        .player-row {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e9ecef;
            padding: 0.5rem 1rem;
            min-height: 56px;
            transition: background 0.2s;
            position: relative;
        }
        .player-row:last-child {
            border-bottom: none;
        }
        .player-row:hover {
            background: #f8f9fa;
        }
        .player-row.customized {
            border-left: 4px solid #28a745;
            background: linear-gradient(90deg, #f8fff9 0%, #ffffff 100%);
        }
        .player-main {
            display: flex;
            align-items: center;
            flex: 1 1 0%;
            gap: 1rem;
            min-width: 0;
        }
        .player-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .position-badge {
            font-size: 0.8rem;
            font-weight: bold;
        }
        .team-badge {
            font-size: 0.7rem;
            background: #6c757d;
        }
        .adp-badge {
            font-size: 0.8rem;
            color: #888;
            margin-left: 8px;
        }
        .ppr-points {
            display: flex;
            gap: 8px;
            margin-left: 1rem;
        }
        .ppr-point {
            background: #f8f9fa;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            text-align: center;
            min-width: 48px;
        }
        .ppr-point.full-ppr {
            background: #e3f2fd;
            color: #1976d2;
        }
        .ppr-point.half-ppr {
            background: #fff3e0;
            color: #f57c00;
        }
        .ppr-point.non-ppr {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        .star-toggle {
            display: inline-block;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #adb5bd;
            margin-left: 1rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
        }
        .star-toggle:hover {
            border-color: var(--hal-red, #ff2f1a);
        }
        .star-toggle.starred {
            background: var(--hal-red, #ff2f1a);
            border-color: var(--hal-red, #ff2f1a);
            box-shadow: 0 0 6px rgba(255, 47, 26, 0.7);
        }
        .expand-section {
            width: 100%;
            background: #f8f9fa;
            border-radius: 0 0 8px 8px;
            margin-top: 0.5rem;
            padding: 1rem 2rem 1rem 2rem;
            display: none;
        }
        .expand-section.show {
            display: block;
        }
    </style>
</head>
<body class="hal-theme">
    <div class="container-fluid">
        <!-- Header -->
        <div class="row">
            <div class="col-12">
                <div class="draft-status">
                    <div class="row align-items-center">
                        <div class="col-md-8">
                            <h2><span class="hal-eye me-2"></span>Pre Draft Analysis</h2>
                            <p class="mb-0">Analyze and customize player projections before the draft</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Navigation Tabs -->
        <div class="row">
            <div class="col-12">
                <ul class="nav nav-tabs" id="preDraftTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" href="/app" role="tab">
                            <i class="fas fa-drafting-compass me-2"></i>Draft Room
                        </a>
                    </li>
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" href="/app" role="tab">
                            <i class="fas fa-chart-line me-2"></i>Pre Draft
                        </a>
                    </li>
                    <li class="nav-item ms-auto" role="presentation">
                        <a class="nav-link" href="/user" role="tab">
                            <i class="fas fa-user me-2"></i>User
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="row">
            <div class="col-12">
                <div class="filter-section">
                    <div class="row align-items-end">
                        <div class="col-md-3">
                            <label for="positionFilter" class="form-label">Position</label>
                            <select class="form-select" id="positionFilter">
                                <option value="">All Positions</option>
                                <option value="QB">Quarterbacks</option>
                                <option value="RB">Running Backs</option>
                                <option value="WR">Wide Receivers</option>
                                <option value="TE">Tight Ends</option>
                                <option value="K">Kickers</option>
                                <option value="DST">Defense/Special Teams</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="sortBy" class="form-label">Sort By</label>
                            <select class="form-select" id="sortBy">
                                <option value="adp">ADP</option>
                                <option value="ppr">PPR Points</option>
                                <option value="half_ppr">Half-PPR Points</option>
                                <option value="standard">Standard Points</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="searchFilter" class="form-label">Search Players</label>
                            <input type="text" class="form-control" id="searchFilter" placeholder="Enter player name...">
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary w-100" onclick="loadPlayers()">
                                <i class="fas fa-search me-2"></i>Load Players
                            </button>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12 text-center">
                            <button class="btn btn-danger" onclick="resetAllPlayerData()">
                                <i class="fas fa-trash me-2"></i>Reset All Player Data
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Players Display -->
        <div class="row">
            <div class="col-12">
                <div id="playersContainer">
                    <div class="loading-spinner">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                        <p class="mt-2">Click "Load Players" to start analyzing</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allPlayers = [];
        let filteredPlayers = [];

        function loadPlayers() {
            const position = document.getElementById('positionFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            const container = document.getElementById('playersContainer');
            
            container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-2">Loading players...</p></div>';
            
            // Build URL with position filter
            const url = position ? `/api/load_players_with_custom_projections?position=${position}` : '/api/load_players_with_custom_projections';
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        allPlayers = data;
                        filteredPlayers = [...allPlayers];
                        displayPlayers();
                    } else if (data.error) {
                        container.innerHTML = '<div class="alert alert-danger">Error loading players: ' + data.error + '</div>';
                    } else {
                        container.innerHTML = '<div class="alert alert-danger">Error loading players: Invalid response format</div>';
                    }
                })
                .catch(error => {
                    container.innerHTML = '<div class="alert alert-danger">Error loading players: ' + error.message + '</div>';
                });
        }

        function displayPlayers() {
            const container = document.getElementById('playersContainer');
            const searchTerm = document.getElementById('searchFilter').value.toLowerCase();
            const sortBy = document.getElementById('sortBy').value;
            
            // Filter by search term
            const searchFiltered = searchTerm ? 
                filteredPlayers.filter(player => 
                    player.name.toLowerCase().includes(searchTerm) ||
                    player.team.toLowerCase().includes(searchTerm)
                ) : filteredPlayers;
            
            // Sort players based on selected criteria
            const sortedPlayers = [...searchFiltered].sort((a, b) => {
                switch(sortBy) {
                    case 'adp':
                        return a.adp - b.adp;
                    case 'ppr':
                        return b.ppr_points - a.ppr_points;
                    case 'half_ppr':
                        return b.half_ppr_points - a.half_ppr_points;
                    case 'standard':
                        return b.non_ppr_points - a.non_ppr_points;
                    default:
                        return a.adp - b.adp;
                }
            });
            
            if (sortedPlayers.length === 0) {
                container.innerHTML = '<div class="alert alert-info">No players found matching your criteria.</div>';
                return;
            }
            
            let html = '<div class="players-horizontal-list">';

            sortedPlayers.forEach((player) => {
                const isStarred = player.is_starred || false;
                const escapedName = player.name.replace(/'/g, "\\'").replace(/"/g, '\\"');
                html += `
                    <div class="player-row">
                        <div class="player-main">
                            <span class="player-name">${player.name}</span>
                            <span class="badge position-badge bg-primary ms-2">${player.position}</span>
                            <span class="badge team-badge ms-1">${player.team}</span>
                            <span class="adp-badge ms-2">ADP: ${player.adp}</span>
                            <div class="ppr-points ms-3">
                                <span class="ppr-point full-ppr">PPR<br>${player.ppr_points}</span>
                                <span class="ppr-point half-ppr">Half<br>${player.half_ppr_points}</span>
                                <span class="ppr-point non-ppr">Non<br>${player.non_ppr_points}</span>
                            </div>
                        </div>
                        <div class="d-flex align-items-center ms-auto">
                            <span class="star-toggle ${isStarred ? 'starred' : ''}"
                                  onclick="toggleStar('${escapedName}', this)"
                                  title="${isStarred ? 'Starred - click to unstar' : 'Star this player'}"></span>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            container.innerHTML = html;
        }

        function toggleStar(playerName, dotEl) {
            fetch('/api/toggle_star_player', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ player_name: playerName })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.success) {
                    showNotification('Error updating star: ' + data.error, 'error');
                    return;
                }

                dotEl.classList.toggle('starred', data.starred);
                dotEl.title = data.starred ? 'Starred - click to unstar' : 'Star this player';

                // Keep local player data in sync so re-sorting/filtering doesn't lose it
                [allPlayers, filteredPlayers].forEach(list => {
                    const player = list.find(p => p.name === playerName);
                    if (player) player.is_starred = data.starred;
                });
            })
            .catch(error => {
                showNotification('Error updating star: ' + error.message, 'error');
            });
        }

        function showNotification(message, type) {
            // Create notification element
            const notification = document.createElement('div');
            notification.className = `alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show position-fixed`;
            notification.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            notification.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            document.body.appendChild(notification);
            
            // Auto-remove after 3 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 3000);
        }

        // Search functionality
        document.getElementById('searchFilter').addEventListener('input', function() {
            if (allPlayers.length > 0) {
                displayPlayers();
            }
        });

        // Sort functionality
        document.getElementById('sortBy').addEventListener('change', function() {
            if (allPlayers.length > 0) {
                displayPlayers();
            }
        });

        // Position filter functionality
        document.getElementById('positionFilter').addEventListener('change', function() {
            // Reload players with new position filter
            loadPlayers();
        });

        // Load players on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadPlayers();
        });

        function resetAllPlayerData() {
            if (confirm('Are you sure you want to reset all players to FantasyPros default data? This will clear all customizations.')) {
                const container = document.getElementById('playersContainer');
                container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin fa-2x"></i><p class="mt-2">Resetting to FantasyPros data...</p></div>';

                fetch('/api/reset_all_players', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Reload players to get fresh data
                        loadPlayers();
                        showNotification('All players reset to FantasyPros default data!', 'success');
                    } else {
                        showNotification('Error resetting players: ' + data.error, 'error');
                        displayPlayers(); // Show current data even if reset failed
                    }
                })
                .catch(error => {
                    showNotification('Error resetting players: ' + error.message, 'error');
                    displayPlayers(); // Show current data even if reset failed
                });
            }
        }
    </script>
</body>
</html>
