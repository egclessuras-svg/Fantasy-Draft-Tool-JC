<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PickProphet</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="/static/css/hal-theme.css" rel="stylesheet">
</head>
<body class="hal-theme min-h-screen flex items-center justify-center">
    <div class="hal-auth-card p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="hal-eye hal-eye-lg mb-3"></div>
            <h1 class="text-3xl mb-2">PickProphet</h1>
            <p class="hal-subtle">Create Your Account</p>
        </div>

        <form id="registerForm" class="space-y-6">
            <div>
                <label for="email" class="block mb-2">Email</label>
                <input type="email" id="email" name="email" required class="w-full px-3 py-2">
            </div>

            <div>
                <label for="password" class="block mb-2">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-3 py-2">
            </div>

            <div>
                <label for="confirmPassword" class="block mb-2">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required class="w-full px-3 py-2">
            </div>

            <button type="submit" class="w-full py-2 px-4 hal-submit-btn">
                Create Account
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="hal-subtle">Already have an account?
                <a href="/login">Sign in</a>
            </p>
        </div>

        <div id="errorMessage" class="mt-4 p-3 hal-error hidden"></div>
        <div id="successMessage" class="mt-4 p-3 hal-success hidden"></div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            // Hide previous messages
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            // Validate passwords match
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Validate password length
            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters long';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = 'Account created successfully! Redirecting...';
                    successDiv.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
